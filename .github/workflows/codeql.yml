name: CodeQL

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/codeql.yml"
      - "src/**"
      - "scripts/**"
      - "*.ts"
      - "*.js"
      - "*.mjs"
      - "package.json"
      - "bun.lock"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/codeql.yml"
      - "src/**"
      - "scripts/**"
      - "*.ts"
      - "*.js"
      - "*.mjs"
      - "package.json"
      - "bun.lock"
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    name: Analyze
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    permissions:
      security-events: write # Upload CodeQL analysis results
      actions: read # Read workflow metadata for pull request analysis
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
