name: Release and Deploy

on:
  push:
    branches:
      - main

env:
  CLOUDFLARE_PROJECT_NAME: personal-website

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new-release-published: ${{ steps.release.outputs.new-release-published }}
      new-release-version: ${{ steps.release.outputs.new-release-version }}
      new-release-tag: ${{ steps.release.outputs.new-release-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx --no-install semantic-release

      - name: Upload build artifact
        if: steps.release.outputs.new-release-published == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ steps.release.outputs.new-release-version }}
          path: dist/
          retention-days: 7

  deploy:
    needs: release
    if: needs.release.outputs.new-release-published == 'true'
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    permissions: {}
    environment:
      name: production
      url: https://urrutia.me
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ needs.release.outputs.new-release-version }}
          path: dist/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }} --commit-hash=${{ github.sha }}

  lighthouse:
    needs: deploy
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ".bun-version"

      - name: Install badge dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Lighthouse audit
        id: audit
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
        with:
          urls: |
            https://urrutia.me/
            https://urrutia.me/es/
            https://urrutia.me/blog/
            https://urrutia.me/es/blog/
          runs: 3
          uploadArtifacts: true
          configPath: ./lighthouserc.release.json

      - name: Extract Lighthouse scores
        id: scores
        env:
          LIGHTHOUSE_RESULTS_PATH: ${{ steps.audit.outputs.resultsPath }}
        run: bun scripts/lighthouse-badge.ts extract

      - name: Generate Lighthouse badges
        env:
          LIGHTHOUSE_PERFORMANCE: ${{ steps.scores.outputs.performance }}
          LIGHTHOUSE_ACCESSIBILITY: ${{ steps.scores.outputs.accessibility }}
          LIGHTHOUSE_BEST_PRACTICES: ${{ steps.scores.outputs.best_practices }}
          LIGHTHOUSE_SEO: ${{ steps.scores.outputs.seo }}
          LIGHTHOUSE_BADGE_OUTPUT_DIR: ${{ runner.temp }}/lighthouse-badges
        run: bun scripts/lighthouse-badge.ts render

      - name: Upload Lighthouse badge artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-badges
          path: ${{ runner.temp }}/lighthouse-badges/
          retention-days: 7

  publish-lighthouse-badge:
    needs: [release, lighthouse]
    runs-on: ubicloud-standard-2
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download Lighthouse badges
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lighthouse-badges
          path: ${{ runner.temp }}/lighthouse-badges

      - name: Upload badges to GitHub Release
        env:
          BADGE_DIR: ${{ runner.temp }}/lighthouse-badges
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.new-release-tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -u
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Invalid release tag: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          badge_names=(
            lighthouse-performance.svg
            lighthouse-accessibility.svg
            lighthouse-best-practices.svg
            lighthouse-seo.svg
          )
          existing_assets_output=$(gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json assets --jq '.assets[].name')
          mapfile -t existing_assets <<< "$existing_assets_output"
          badge_paths=()
          for badge_name in "${badge_names[@]}"; do
            badge_path="$BADGE_DIR/$badge_name"
            if [[ ! -f "$badge_path" ]]; then
              printf 'Missing Lighthouse badge: %s\n' "$badge_path" >&2
              exit 1
            fi
            asset_exists=false
            for existing_asset in "${existing_assets[@]}"; do
              if [[ "$existing_asset" == "$badge_name" ]]; then
                asset_exists=true
                break
              fi
            done
            if [[ "$asset_exists" == "false" ]]; then
              badge_paths+=("$badge_path")
            fi
          done
          if [[ "${#badge_paths[@]}" -eq 0 ]]; then
            printf 'Lighthouse badges already exist for %s\n' "$RELEASE_TAG"
            exit 0
          fi
          gh release upload "$RELEASE_TAG" "${badge_paths[@]}" --repo "$REPOSITORY"

      - name: Publish latest Lighthouse badges
        env:
          BADGE_DIR: ${{ runner.temp }}/lighthouse-badges
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.new-release-tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -u
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Invalid release tag: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          badge_names=(
            lighthouse-performance.svg
            lighthouse-accessibility.svg
            lighthouse-best-practices.svg
            lighthouse-seo.svg
          )
          for badge_name in "${badge_names[@]}"; do
            badge_path="$BADGE_DIR/$badge_name"
            if [[ ! -f "$badge_path" ]]; then
              printf 'Missing Lighthouse badge: %s\n' "$badge_path" >&2
              exit 1
            fi
            error_path="$RUNNER_TEMP/$badge_name.error"
            if badge_sha=$(gh api "repos/$REPOSITORY/contents/$badge_name?ref=badges" --jq .sha 2>"$error_path"); then
              :
            elif grep -Fq '(HTTP 404)' "$error_path"; then
              badge_sha=''
            else
              cat "$error_path" >&2
              exit 1
            fi
            if [[ -n "$badge_sha" && ! "$badge_sha" =~ ^[0-9a-f]{40}$ ]]; then
              printf 'Invalid badge blob SHA for %s: %s\n' "$badge_name" "$badge_sha" >&2
              exit 1
            fi
            badge_content=$(base64 < "$badge_path" | tr -d '\n')
            api_args=(
              --method PUT
              "repos/$REPOSITORY/contents/$badge_name"
              -f branch=badges
              -f message="chore: update $badge_name for $RELEASE_TAG"
              -f content="$badge_content"
              --silent
            )
            if [[ -n "$badge_sha" ]]; then
              api_args+=(-f sha="$badge_sha")
            fi
            gh api "${api_args[@]}"
          done
